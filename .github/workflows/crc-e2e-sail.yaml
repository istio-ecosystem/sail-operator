name: crc-e2e-sail

# CRC OpenShift Local E2E — postsubmit signal run against merged code.
# Triggered on push to main/release-* (i.e. after every merged PR) so secrets are always
# available and only maintainer-approved code is exercised.
# Keep this workflow OUT of branch-protection required status checks.
# Requires secrets: CRC_PULL_SECRET, QUAY_USER, QUAY_PWD.

on:
  workflow_dispatch:
    inputs:
      test_tier:
        description: CRC E2E coverage tier
        required: true
        default: standard
        type: choice
        options:
          - smoke
          - standard
          - extended
  push:
    branches:
      - main
      - release-*

permissions:
  contents: read

jobs:
  preflight:
    name: Resolve Build Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.get-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            common/scripts/setup_env.sh
          sparse-checkout-cone-mode: false

      - name: Extract IMAGE_VERSION from base branch
        id: get-image
        run: |
          version=$(grep -E '^\s*IMAGE_VERSION=' common/scripts/setup_env.sh \
                    | grep -v ':-' | head -1 | sed 's/.*IMAGE_VERSION=//')
          if [[ -z "${version}" ]]; then
            echo "::error::Could not extract IMAGE_VERSION from common/scripts/setup_env.sh"
            exit 1
          fi
          image="registry.istio.io/testing/build-tools:${version}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Resolved build image: ${image}"

  build-push:
    name: Build and push operator image
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    container:
      image: ${{ needs.preflight.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PWD }}

      - name: Build and push operator image
        id: build
        shell: bash
        env:
          HUB: quay.io/sail-dev
          BUILD_WITH_CONTAINER: "0"
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          COMMIT_HASH="${GITHUB_SHA:0:7}"
          TAG="ci-test-${COMMIT_HASH}-amd64"
          make docker-push HUB=${HUB} TAG=${TAG}
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # One CRC cluster for all tiers. A matrix would start CRC 3x (~30m each)
  # and burn free-tier minutes; sequential steps share a single cluster instead.
  e2e:
    name: e2e openshift local (${{ github.event_name == 'workflow_dispatch' && inputs.test_tier || 'standard' }})
    needs: [preflight, build-push]
    runs-on: ubuntu-latest
    env:
      TEST_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.test_tier || 'standard' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start CRC OpenShift cluster
        uses: crc-org/crc-github-action@v1
        with:
          pull-secret: ${{ secrets.CRC_PULL_SECRET }}
          preset: openshift

      - name: Prepare CRC for E2E tests
        run: |
          set -euo pipefail
          echo "=== Node resources before prep ==="
          oc describe node | sed -n '/Allocatable:/,/Allocated resources:/p;/Allocated resources:/,/Events:/p' || true

          # Marketplace catalog pods are not needed for helm-based tests and often sit in
          # ImagePullBackOff while consuming request budget on small CRC nodes.
          oc scale deployment -n openshift-marketplace --all --replicas=0 || true
          oc delete pods -n openshift-marketplace --all --force --grace-period=0 || true

          echo "Waiting for cluster operators to settle..."
          for i in $(seq 1 30); do
            if oc wait clusteroperator --all --for=condition=Available=True --for=condition=Progressing=False --for=condition=Degraded=False --timeout=30s 2>/dev/null; then
              echo "Cluster operators stable"
              break
            fi
            echo "attempt ${i}/30: clusteroperators not stable yet"
            sleep 10
          done

          echo "=== Node resources after prep ==="
          oc describe node | sed -n '/Allocated resources:/,/Events:/p' || true
          oc get pods -A | grep -v Running | grep -v Completed || true

      - name: Run CRC E2E tests
        id: crc-e2e
        env:
          BUILD_IMAGE: ${{ needs.preflight.outputs.image }}
          OPERATOR_TAG: ${{ needs.build-push.outputs.tag }}
          WORKSPACE: ${{ github.workspace }}
          ARTIFACTS_ROOT: ${{ github.workspace }}/artifacts
        run: |
          set -euo pipefail
          chmod +x tests/e2e/crc-e2e-ci.sh
          if ! tests/e2e/crc-e2e-ci.sh "${TEST_TIER}"; then
            echo "::error::CRC E2E tier ${TEST_TIER} failed; capturing cluster snapshot"
            {
              echo "=== pods -A ==="
              oc get pods -A -o wide || true
              echo "=== sail-operator ==="
              oc get all,events -n sail-operator -o wide || true
              oc describe pods -n sail-operator || true
              oc describe deploy -n sail-operator || true
              echo "=== istio-cni / istio-system / ztunnel ==="
              oc get all,istiocni,istio,ztunnel -A || true
              oc describe pods -n istio-cni || true
              oc describe pods -n istio-system || true
              oc describe pods -n ztunnel || true
              echo "=== node allocated ==="
              oc describe node | sed -n '/Allocated resources:/,/Events:/p' || true
            } | tee "${ARTIFACTS_ROOT}/cluster-snapshot.txt"
            exit 1
          fi

      - name: Print OpenShift version
        if: always()
        run: oc version

      - name: Debug cluster state on failure
        if: failure()
        run: |
          echo "=== Nodes ==="
          oc get nodes -o wide || true
          echo "=== Node allocatable / capacity ==="
          oc describe nodes || true
          echo "=== All pods ==="
          oc get pods -A || true
          echo "=== sail-operator pod describe ==="
          oc describe pods -n sail-operator || true
          echo "=== istio-system pod describe ==="
          oc describe pods -n istio-system || true
          echo "=== istio-cni pod describe ==="
          oc describe pods -n istio-cni || true
          echo "=== ztunnel pod describe ==="
          oc describe pods -n ztunnel || true
          echo "=== sail-operator logs ==="
          oc logs -n sail-operator -l app=sail-operator --tail=100 || true
          echo "=== Events ==="
          oc get events -A --sort-by='.lastTimestamp' | tail -50 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-crc-${{ env.TEST_TIER }}
          path: ${{ github.workspace }}/artifacts/
          if-no-files-found: warn

  notify-failure:
    name: Open issue on failure
    needs: e2e
    # Only fire on real postsubmit runs — not on workflow_dispatch, where
    # a human is already watching the run.
    if: failure() && github.event_name == 'push' && needs.e2e.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Write issue body
        env:
          BRANCH: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/crc-e2e-failure.md <<EOF
          CRC OpenShift Local E2E (\`e2e\` job, tier \`standard\`) failed on \`${BRANCH}\` at \`${SHORT_SHA:0:7}\`.

          - Failed job: \`e2e openshift local\`
          - [View failing run / logs](${RUN_URL})
          EOF

      - name: Raise an Issue to report CRC E2E failure
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: CRC E2E failed on ${{ github.ref_name }}
          content-filepath: /tmp/crc-e2e-failure.md
          labels: automated, test-e2e
