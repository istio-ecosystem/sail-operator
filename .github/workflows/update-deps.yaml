name: Update-deps workflow

on:
  schedule: 
    - cron: "0 5 * * *" # everyday at 5AM UTC

run-name: update-deps

env:
  GIT_USER: ${{ secrets.GIT_USER }}
  GH_TOKEN: ${{ secrets.GIT_TOKEN }}
  AUTOMATOR_ORG: istio-ecosystem
  AUTOMATOR_REPO: sail-operator

jobs:
  update-deps:
    runs-on: ubuntu-latest
    container:
      image: registry.istio.io/testing/build-tools:master-344978549023107b14c57d2ef8523d41b82ccc76
      options: --entrypoint ''

    steps:
    - uses: actions/checkout@v4
      with:
        repository: istio/test-infra
        ref: master

    # this is a workaround for a permissions issue when using the istio build container
    - run: git config --system --add safe.directory /__w/sail-operator/sail-operator

    # Istio stopped publishing to registry.istio.io as of 1.31 so those component
    # images are mirrored to quay.io/sail-dev.
    # update_deps.sh copies them with crane when MIRROR_IMAGES=true (see the main
    # automator step below), which needs push credentials for that repository.
    - name: Log in to quay.io
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USER }}
        password: ${{ secrets.QUAY_PWD }}

    - name: Run Automator main
      run: |
        ./tools/automator/automator.sh \
          --org=$AUTOMATOR_ORG \
          --repo=sail-operator \
          --branch=main \
          '--title=Automator: Update dependencies in $AUTOMATOR_ORG/$AUTOMATOR_REPO@main' \
          --labels=auto-merge \
          --email=openshiftservicemeshbot@gmail.com \
          --modifier=update_deps \
          --token-env \
          --cmd='BUILD_WITH_CONTAINER=0 MIRROR_IMAGES=true ./tools/update_deps.sh' \
          --signoff
    - name: Run Automator release-1.31
      run: |
        ./tools/automator/automator.sh \
          --org=$AUTOMATOR_ORG \
          --repo=sail-operator \
          --branch=release-1.31 \
          '--title=Automator: Update dependencies in $AUTOMATOR_ORG/$AUTOMATOR_REPO@release-1.31' \
          --labels=auto-merge \
          --email=openshiftservicemeshbot@gmail.com \
          --modifier=update_deps \
          --token-env \
          --cmd='BUILD_WITH_CONTAINER=0 UPDATE_BRANCH=release-1.31 PIN_MINOR=true TOOLS_ONLY=true ./tools/update_deps.sh' \
          --signoff
    - name: Run Automator release-1.30
      run: |
        ./tools/automator/automator.sh \
          --org=$AUTOMATOR_ORG \
          --repo=sail-operator \
          --branch=release-1.30 \
          '--title=Automator: Update dependencies in $AUTOMATOR_ORG/$AUTOMATOR_REPO@release-1.30' \
          --labels=auto-merge \
          --email=openshiftservicemeshbot@gmail.com \
          --modifier=update_deps \
          --token-env \
          --cmd='BUILD_WITH_CONTAINER=0 UPDATE_BRANCH=release-1.30 PIN_MINOR=true TOOLS_ONLY=true ./tools/update_deps.sh' \
          --signoff
    - name: Run Automator release-1.29
      run: |
        ./tools/automator/automator.sh \
          --org=$AUTOMATOR_ORG \
          --repo=sail-operator \
          --branch=release-1.29 \
          '--title=Automator: Update dependencies in $AUTOMATOR_ORG/$AUTOMATOR_REPO@release-1.29' \
          --labels=auto-merge \
          --email=openshiftservicemeshbot@gmail.com \
          --modifier=update_deps \
          --token-env \
          --cmd='BUILD_WITH_CONTAINER=0 UPDATE_BRANCH=release-1.29 PIN_MINOR=true TOOLS_ONLY=true ./tools/update_deps.sh' \
          --signoff
    - name: Run Automator release-1.28
      run: |
        ./tools/automator/automator.sh \
          --org=$AUTOMATOR_ORG \
          --repo=sail-operator \
          --branch=release-1.28 \
          '--title=Automator: Update dependencies in $AUTOMATOR_ORG/$AUTOMATOR_REPO@release-1.28' \
          --labels=auto-merge \
          --email=openshiftservicemeshbot@gmail.com \
          --modifier=update_deps \
          --token-env \
          --cmd='BUILD_WITH_CONTAINER=0 UPDATE_BRANCH=release-1.28 PIN_MINOR=true TOOLS_ONLY=true ./tools/update_deps.sh' \
          --signoff
