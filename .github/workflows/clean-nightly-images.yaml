name: Nightly image cleaning build workflow

on:
  # Scheduled runs are disabled; the workflow can only be triggered manually.
  # The previous attempt to disable it with an impossible date (cron "0 6 30 2 *",
  # i.e. February 30th) did not work - GitHub's scheduler kept firing it every
  # few minutes instead of never.
  # Original schedule was "0 6 * * *" - a few hours after publishing new nightly images to avoid conflicts.
  workflow_dispatch: {}

run-name: clean-nightly-images

env:
  GIT_USER: ${{ secrets.GIT_USER }}
  GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}

jobs:
  clean-nightlies:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: main

    - name: Clean old nightly releases in OpenShift OperatorHub
      run: hack/operatorhub/clean-nightlies.sh
      env:
        GIT_CONFIG_USER_NAME: "${{ github.actor }}"
        GIT_CONFIG_USER_EMAIL: "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
