                  value: 0
                - color: red
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |-
                    round(
                      sum(irate(istio_requests_total{destination_service=~"$service",reporter="destination"}[5m])),
                      0.001
                    )
      "1_5":
        kind: Panel
        spec:
          display:
            name: Server Success Rate (non-5xx responses)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: percent-decimal
              sparkline:
                width: 1
              thresholds:
                defaultColor: dark-red
                mode: absolute
                steps:
                - color: dark-red
                  value: 0
                - color: dark-yellow
                  value: 0.95
                - color: dark-green
                  value: 0.99
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        (
                            sum(
                              irate(
                                istio_requests_total{destination_service=~"$service",reporter="destination",response_code!~"5.*"}[5m]
                              )
                            )
                          /
                            sum(irate(istio_requests_total{destination_service=~"$service",reporter="destination"}[5m]))
                        )
                      >
                        -1
                    or on ()
                      vector(1)
      "1_6":
        kind: Panel
        spec:
          display:
            name: Server Request Duration
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                size: medium
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        histogram_quantile(
                          0.5,
                          sum by (le) (
                            irate(
                              istio_request_duration_milliseconds_bucket{destination_service=~"$service",reporter="destination"}[5m]
                            )
                          )
                        )
                      /
                        1000
                    or
                      histogram_quantile(
                        0.5,
                        sum by (le) (
                          irate(
                            istio_request_duration_seconds_bucket{destination_service=~"$service",reporter="destination"}[5m]
                          )
                        )
                      )
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        histogram_quantile(
                          0.9,
                          sum by (le) (
                            irate(
                              istio_request_duration_milliseconds_bucket{destination_service=~"$service",reporter="destination"}[5m]
                            )
                          )
                        )
                      /
                        1000
                    or
                      histogram_quantile(
                        0.9,
                        sum by (le) (
                          irate(
                            istio_request_duration_seconds_bucket{destination_service=~"$service",reporter="destination"}[5m]
                          )
                        )
                      )
                  seriesNameFormat: P90
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        histogram_quantile(
                          0.99,
                          sum by (le) (
                            irate(
                              istio_request_duration_milliseconds_bucket{destination_service=~"$service",reporter="destination"}[5m]
                            )
                          )
                        )
                      /
                        1000
                    or
                      histogram_quantile(
                        0.99,
                        sum by (le) (
                          irate(
                            istio_request_duration_seconds_bucket{destination_service=~"$service",reporter="destination"}[5m]
                          )
                        )
                      )
                  seriesNameFormat: P99
      "1_7":
        kind: Panel
        spec:
          display:
            name: TCP Sent Bytes
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              format:
                unit: bytes/sec
              sparkline:
                width: 1
              thresholds:
                defaultColor: green
                mode: absolute
                steps:
                - color: green
                  value: 0
                - color: red
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: sum(irate(istio_tcp_sent_bytes_total{destination_service=~"$service",reporter=~"$qrep"}[1m]))
      "2_0":
        kind: Panel
        spec:
          display:
            name: CLIENT WORKLOADS
          plugin:
            kind: Markdown
            spec:
              text: |-
                <div class="dashboard-header text-center">
                <span>CLIENT WORKLOADS</span>
                </div>
      "2_1":
        kind: Panel
        spec:
          display:
            name: Incoming Requests By Source And Response Code
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                size: medium
              visual:
                display: line
                lineWidth: 1
              yAxis: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |-
                    round(
                      sum by (source_workload, source_workload_namespace, response_code) (
                        irate(
                          istio_requests_total{connection_security_policy="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                        )
                      ),
                      0.001
                    )
                  seriesNameFormat: "{{ source_workload }}.{{ source_workload_namespace
                    }} : {{ response_code }} (\U0001F510mTLS)"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |-
                    round(
                      sum by (source_workload, source_workload_namespace, response_code) (
                        irate(
                          istio_requests_total{connection_security_policy!="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                        )
                      ),
                      0.001
                    )
                  seriesNameFormat: '{{ source_workload }}.{{ source_workload_namespace
                    }} : {{ response_code }}'
      "2_2":
        kind: Panel
        spec:
          display:
            name: Incoming Success Rate (non-5xx responses) By Source
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                size: medium
              visual:
                areaOpacity: 0.1
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent-decimal
                max: 1.01
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                      sum by (source_workload, source_workload_namespace) (
                        irate(
                          istio_requests_total{connection_security_policy="mutual_tls",destination_service=~"$service",reporter=~"$qrep",response_code!~"5.*"}[5m]
                        )
                      )
                    /
                      sum by (source_workload, source_workload_namespace) (
                        irate(
                          istio_requests_total{connection_security_policy="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                        )
                      )
                  seriesNameFormat: "{{ source_workload }}.{{ source_workload_namespace
                    }} (\U0001F510mTLS)"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                      sum by (source_workload, source_workload_namespace) (
                        irate(
                          istio_requests_total{connection_security_policy!="mutual_tls",destination_service=~"$service",reporter=~"$qrep",response_code!~"5.*"}[5m]
                        )
                      )
                    /
                      sum by (source_workload, source_workload_namespace) (
                        irate(
                          istio_requests_total{connection_security_policy!="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                        )
                      )
                  seriesNameFormat: '{{ source_workload }}.{{ source_workload_namespace
                    }}'
      "3_0":
