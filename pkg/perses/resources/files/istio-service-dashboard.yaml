                          0.5,
                          sum by (source_workload, source_workload_namespace, le) (
                            irate(
                              istio_request_duration_milliseconds_bucket{connection_security_policy="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                            )
                          )
                        )
                      /
                        1000
                    or
                      histogram_quantile(
                        0.5,
                        sum by (source_workload, source_workload_namespace, le) (
                          irate(
                            istio_request_duration_seconds_bucket{connection_security_policy="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                          )
                        )
                      )
                  seriesNameFormat: "{{source_workload}}.{{source_workload_namespace}}
                    P50 (\U0001F510mTLS)"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        histogram_quantile(
                          0.9,
                          sum by (source_workload, source_workload_namespace, le) (
                            irate(
                              istio_request_duration_milliseconds_bucket{connection_security_policy="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                            )
                          )
                        )
                      /
                        1000
                    or
                      histogram_quantile(
                        0.9,
                        sum by (source_workload, source_workload_namespace, le) (
                          irate(
                            istio_request_duration_seconds_bucket{connection_security_policy="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                          )
                        )
                      )
                  seriesNameFormat: "{{source_workload}}.{{source_workload_namespace}}
                    P90 (\U0001F510mTLS)"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
