apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: istio-service-dashboard
    app.kubernetes.io/name: perses-dashboard
    app.kubernetes.io/part-of: perses-operator
  name: istio-service-dashboard
  namespace: default
spec:
  config:
    display:
      name: Istio Service Dashboard
    duration: 1h
    layouts:
    - kind: Grid
      spec:
        display:
          title: General
        items:
        - content:
            $ref: '#/spec/panels/0_0'
          height: 4
          width: 24
          x: 0
          "y": 0
    - kind: Grid
      spec:
        display:
          title: General
        items:
        - content:
            $ref: '#/spec/panels/1_0'
          height: 8
          width: 12
          x: 0
          "y": 0
        - content:
            $ref: '#/spec/panels/1_1'
          height: 8
          width: 12
          x: 12
          "y": 0
        - content:
            $ref: '#/spec/panels/1_2'
          height: 8
          width: 12
          x: 0
          "y": 8
        - content:
            $ref: '#/spec/panels/1_3'
          height: 8
          width: 12
          x: 12
          "y": 8
        - content:
            $ref: '#/spec/panels/1_4'
          height: 8
          width: 12
          x: 0
          "y": 16
        - content:
            $ref: '#/spec/panels/1_5'
          height: 8
          width: 12
          x: 12
          "y": 16
        - content:
            $ref: '#/spec/panels/1_6'
          height: 8
          width: 12
          x: 0
          "y": 24
        - content:
            $ref: '#/spec/panels/1_7'
          height: 8
          width: 12
          x: 12
          "y": 24
    - kind: Grid
      spec:
        display:
          title: Client Workloads
        items:
        - content:
            $ref: '#/spec/panels/2_0'
          height: 6
          width: 12
          x: 0
          "y": 0
        - content:
            $ref: '#/spec/panels/2_1'
          height: 6
          width: 12
          x: 12
          "y": 0
        - content:
            $ref: '#/spec/panels/2_2'
          height: 6
          width: 12
          x: 0
          "y": 6
    - kind: Grid
      spec:
        display:
          title: Client Workloads (II)
        items:
        - content:
            $ref: '#/spec/panels/3_0'
          height: 6
          width: 8
          x: 0
          "y": 0
        - content:
            $ref: '#/spec/panels/3_1'
          height: 6
          width: 8
          x: 8
          "y": 0
        - content:
            $ref: '#/spec/panels/3_2'
          height: 6
          width: 8
          x: 16
          "y": 0
    - kind: Grid
      spec:
        display:
          title: Client Workloads (III)
        items:
        - content:
            $ref: '#/spec/panels/4_0'
          height: 6
          width: 12
          x: 0
          "y": 0
        - content:
            $ref: '#/spec/panels/4_1'
          height: 6
          width: 12
          x: 12
          "y": 0
    - kind: Grid
      spec:
        display:
          title: Service Workloads
        items:
        - content:
            $ref: '#/spec/panels/5_0'
          height: 6
          width: 12
          x: 0
          "y": 0
        - content:
            $ref: '#/spec/panels/5_1'
          height: 6
          width: 12
          x: 12
          "y": 0
        - content:
            $ref: '#/spec/panels/5_2'
          height: 6
          width: 12
          x: 0
          "y": 6
    - kind: Grid
      spec:
        display:
          title: Service Workloads (II)
        items:
        - content:
            $ref: '#/spec/panels/6_0'
          height: 6
          width: 8
          x: 0
          "y": 0
        - content:
            $ref: '#/spec/panels/6_1'
          height: 6
          width: 8
          x: 8
          "y": 0
        - content:
            $ref: '#/spec/panels/6_2'
          height: 6
          width: 8
          x: 16
          "y": 0
    - kind: Grid
      spec:
        display:
          title: Service Workloads (III)
        items:
        - content:
            $ref: '#/spec/panels/7_0'
          height: 6
          width: 12
          x: 0
          "y": 0
        - content:
            $ref: '#/spec/panels/7_1'
          height: 6
          width: 12
          x: 12
          "y": 0
    panels:
      "0_0":
        kind: Panel
        spec:
          display:
            name: SERVICE
          plugin:
            kind: Markdown
            spec:
              text: |-
                <div class="dashboard-header text-center">
                <span>SERVICE: $service</span>
                </div>
      "1_0":
        kind: Panel
        spec:
          display:
            name: Client Request Volume
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: ops/sec
              sparkline:
                width: 1
              thresholds:
                defaultColor: green
                mode: absolute
                steps:
                - color: green
                  value: 0
                - color: red
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |-
                    round(
                      sum(irate(istio_requests_total{destination_service=~"$service",reporter=~"$qrep"}[5m])),
                      0.001
                    )
      "1_1":
        kind: Panel
        spec:
          display:
            name: Client Success Rate (non-5xx responses)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: percent-decimal
              sparkline:
                width: 1
              thresholds:
                defaultColor: green
                mode: absolute
                steps:
                - color: dark-red
                  value: 0
                - color: dark-yellow
                  value: 0.95
                - color: dark-green
                  value: 0.99
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        (
                            sum(
                              irate(
                                istio_requests_total{destination_service=~"$service",reporter=~"$qrep",response_code!~"5.*"}[5m]
                              )
                            )
                          /
                            sum(irate(istio_requests_total{destination_service=~"$service",reporter=~"$qrep"}[5m]))
                        )
                      >
                        -1
                    or on ()
                      vector(1)
      "1_2":
        kind: Panel
        spec:
          display:
            name: Client Request Duration
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                size: medium
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        histogram_quantile(
                          0.5,
                          sum by (le) (
                            irate(
                              istio_request_duration_milliseconds_bucket{destination_service=~"$service",reporter=~"$qrep"}[5m]
                            )
                          )
                        )
                      /
                        1000
                    or
                      histogram_quantile(
                        0.5,
                        sum by (le) (
                          irate(istio_request_duration_seconds_bucket{destination_service=~"$service",reporter=~"$qrep"}[5m])
                        )
                      )
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        histogram_quantile(
                          0.9,
                          sum by (le) (
                            irate(
                              istio_request_duration_milliseconds_bucket{destination_service=~"$service",reporter=~"$qrep"}[5m]
                            )
                          )
                        )
                      /
                        1000
                    or
                      histogram_quantile(
                        0.9,
                        sum by (le) (
                          irate(istio_request_duration_seconds_bucket{destination_service=~"$service",reporter=~"$qrep"}[5m])
                        )
                      )
                  seriesNameFormat: P90
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        histogram_quantile(
                          0.99,
                          sum by (le) (
                            irate(
                              istio_request_duration_milliseconds_bucket{destination_service=~"$service",reporter=~"$qrep"}[5m]
                            )
                          )
                        )
                      /
                        1000
                    or
                      histogram_quantile(
                        0.99,
                        sum by (le) (
                          irate(istio_request_duration_seconds_bucket{destination_service=~"$service",reporter=~"$qrep"}[5m])
                        )
                      )
                  seriesNameFormat: P99
      "1_3":
        kind: Panel
        spec:
          display:
            name: TCP Received Bytes
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              format:
                unit: bytes/sec
              sparkline:
                width: 1
              thresholds:
                defaultColor: green
                mode: absolute
                steps:
                - color: green
                  value: 0
                - color: red
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: sum(irate(istio_tcp_received_bytes_total{destination_service=~"$service",reporter=~"$qrep"}[1m]))
      "1_4":
        kind: Panel
        spec:
          display:
            name: Server Request Volume
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: ops/sec
              sparkline:
                width: 1
              thresholds:
