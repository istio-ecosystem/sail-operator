                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-datasource
                  query: |2-
                        histogram_quantile(
                          0.5,
                          sum by (source_workload, source_workload_namespace, le) (
                            irate(
                              istio_request_duration_milliseconds_bucket{connection_security_policy!="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                            )
                          )
                        )
                      /
