                        sum by (source_workload, source_workload_namespace, le) (
                          irate(
                            istio_request_duration_seconds_bucket{connection_security_policy="mutual_tls",destination_service=~"$service",reporter=~"$qrep"}[5m]
                          )
                        )
                      )
                  seriesNameFormat: "{{source_workload}}.{{source_workload_namespace}}
