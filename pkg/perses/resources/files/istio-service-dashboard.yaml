    variables:
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: true
        display:
          hidden: false
          name: Service
        name: service
        plugin:
          kind: PrometheusPromQLVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: prometheus-datasource
            expr: sum by (destination_service) (istio_requests_total{destination_service!="unknown"})
              or sum by (destination_service) (istio_tcp_sent_bytes_total{destination_service!="unknown"})
              or sum by (destination_service) (istio_tcp_received_bytes_total{destination_service!="unknown"})
            labelName: destination_service
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: true
        defaultValue: destination
        display:
          hidden: false
          name: Reporter
        name: qrep
        plugin:
          kind: PrometheusPromQLVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: prometheus-datasource
            expr: group by (reporter) (istio_requests_total) or group by (reporter)
              (istio_tcp_sent_bytes_total)
            labelName: reporter
status: {}
