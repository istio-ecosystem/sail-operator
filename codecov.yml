codecov:
  notify:
    require_ci_to_pass: no
    after_n_builds: 2

comment:
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        target: auto
        informational: false
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: false

flags:
  unit-tests:
    carryforward: true
  integration-tests:
    carryforward: true

ignore:
  # Generated code and API types
  - "api/**"
  - "**/*.gen.go"
  - "**/zz_generated*.go"
  # Build and development tools
  - "hack/**"
  - "tools.go"
  # Documentation and examples
  - "docs/**"
  - "enhancements/**"
  # Infrastructure and configuration
  - "chart/**"
  - "licenses/**"
  - "tools/**"
  # Embed-only and entry-point packages (not meaningfully unit-testable)
  - "resources/**"
  - "cmd/**"

  # Test code and test utilities
  - "tests/**"
  - "**/test/**"
  - "**/*_test.go"
  - "pkg/test/**"
