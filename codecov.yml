codecov:
  notify:
    wait_for_ci: true
    after_n_builds: 2   # keep in sync with the number of coverage uploads per commit

comment:
  behavior: spam_less
  require_changes: true

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 1%
        flags: [unit-tests, integration-tests]
    patch:
      default:
        target: 80%
        threshold: 5%

# Flags are auto-registered by the uploads in .github/workflows/.
# carryforward is intentionally omitted: it's a paid feature (we're on free tier).
flags:
  unit-tests: {}
  integration-tests: {}

ignore:
  # Generated code and API types
  - "api/**"
  - "**/*.gen.go"
  - "**/zz_generated*.go"
  # Build and development tools
  - "hack/**"
  - "tools.go"
  # Documentation and examples
  - "docs/**"
  - "enhancements/**"
  - "samples/**"
  # Infrastructure and configuration
  - "chart/**"
  - "licenses/**"
  - "tools/**"
  # Embed-only and entry-point packages (not meaningfully unit-testable)
  - "resources/**"
  - "cmd/**"

  # Test code and test utilities
  - "tests/**"
  - "**/test/**"
  - "**/*_test.go"
  - "pkg/test/**"
