{{ if .Values.bundleGeneration }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: clusterrolebinding
    app.kubernetes.io/instance: {{ .Values.name }}-prometheus-rolebinding
  name: {{ .Values.name }}-prometheus-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.name }}-metrics-reader
subjects:
- kind: ServiceAccount
  name: prometheus-k8s  # SA used by OpenShift Prometheus
  namespace: openshift-monitoring
{{ end }}