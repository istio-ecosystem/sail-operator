apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: prometheus
  name: sail-operator-metrics-monitor
spec:
  endpoints:
  - authorization:
      credentials:
        key: token
        name: sail-operator
      type: Bearer
    interval: 30s
    path: /metrics
    port: https
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: sail-operator
